[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solarfilament"
version = "0.1.0"
description = "Annotation-aware solar filament segmentation competition pipeline"
requires-python = ">=3.11"

[project.scripts]
solarfilament = "solarfilament.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
